{% extends "base.html" %}

{% block title %}Таблица умножения{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Таблица умножения</h1>
    
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        {% for i in range(2, 10) %}
        <a href="/table/{{ i }}" class="bg-white rounded-xl shadow-lg p-6 text-center hover:shadow-xl transition transform hover:-translate-y-1">
            <div class="text-4xl font-bold text-purple-700 mb-2">×{{ i }}</div>
            <div class="text-gray-600">Таблица {{ i }}</div>
        </a>
        {% endfor %}
    </div>
    
    <div class="mt-8 text-center">
        <a href="/train" class="inline-block bg-purple-600 text-white text-xl font-bold py-4 px-8 rounded-full hover:bg-purple-700 transition transform hover:scale-105 shadow-lg">
            Начать тренировку
        </a>
    </div>
</div>
{% endblock %}
