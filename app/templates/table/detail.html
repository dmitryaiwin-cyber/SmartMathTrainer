{% extends "base.html" %}

{% block title %}Таблица ×{{ table_num }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Таблица ×{{ table_num }}</h1>
    
    <div class="bg-white rounded-xl shadow-lg p-8">
        <div class="grid grid-cols-1 gap-4">
            {% for row in table_data %}
            <div class="flex justify-between items-center p-4 bg-purple-50 rounded-lg">
                <span class="text-2xl font-bold text-gray-800">{{ row[0] }} × {{ row[1] }} =</span>
                <span class="text-3xl font-bold text-purple-700">{{ row[2] }}</span>
            </div>
            {% endfor %}
        </div>
    </div>
    
    <div class="mt-8 flex space-x-4 justify-center">
        <a href="/table" class="bg-gray-200 text-gray-700 text-lg font-bold py-3 px-6 rounded-full hover:bg-gray-300 transition">
            Все таблицы
        </a>
        <a href="/train" class="bg-purple-600 text-white text-lg font-bold py-3 px-6 rounded-full hover:bg-purple-700 transition">
            Тренироваться
        </a>
    </div>
</div>
{% endblock %}
